    (async function () {
        if (typeof MINERA_SUPERAPP === 'undefined' || !MINERA_SUPERAPP) return;
        const session = await requireSession();
        if (!session) return;
        const perfil = await getPerfil(session);
        if (typeof aplicarUserLabel === 'function') aplicarUserLabel(perfil);
        montarNav('apps', perfil);
    })();
